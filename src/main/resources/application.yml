server:
  port: ${PORT:8080}

spring:
  application:
    name: cybershield-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:cybershield;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

cybershield:
  ml-service-url: ${CYBERSHIELD_ML_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: CyberShield API
    description: Network traffic analysis and history service
